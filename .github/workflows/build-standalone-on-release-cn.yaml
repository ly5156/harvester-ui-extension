name: CN Build Standalone on Release
on:
  push:
    tags:
      - v[1-9].*

jobs:
  build-validation:
    name: Build Test
    uses: ./.github/workflows/run-lint-cn.yaml
  build:
    name: Build and Upload Package
    uses: ./.github/workflows/build-and-publish-standalone-cn.yaml
    secrets: inherit
    needs:
      - build-validation
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      CI_BUILD_TAG: ${{github.ref_name}}
